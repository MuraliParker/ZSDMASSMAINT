# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.0"
metadata:
  name: com.sd.massmaint.parker.zsdmassmaint
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DS1
          url: http://parkerds1vm:8001
          client: '100'
        app:
          name: ZSDMASSMAINT
          description: Mass Maintenance SCS_E004
          package: ZFIORIP
          transport: DS1K908176
        exclude:
          - /test/
